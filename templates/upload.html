<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Upload Resume</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

    <header>

        <div class="logo">
            AI Career & Resume Assistant
        </div>

        <nav>
            <a href="/">Home</a>
        </nav>

    </header>


    <main class="upload-page">

    <h1>Analyze Your Resume</h1>

    <p>
        Upload your resume and select your target career.
    </p>

    <form
        action="/upload"
        method="POST"
        enctype="multipart/form-data"
    >

        <label for="resume">
            Upload Resume:
        </label>

        <br><br>

        <input
            type="file"
            id="resume"
            name="resume"
            accept=".pdf"
            required
        >

        <br><br>

        <label for="job_role">
            Select Target Career:
        </label>

        <br><br>

        <select id="job_role" name="job_role" required>

            <option value="">
                -- Select a career --
            </option>

            <option value="Data Scientist">
                Data Scientist
            </option>

            <option value="Data Analyst">
                Data Analyst
            </option>

            <option value="Software Developer">
                Software Developer
            </option>

            <option value="Machine Learning Engineer">
                Machine Learning Engineer
            </option>

            <option value="Web Developer">
                Web Developer
            </option>

        </select>

        <br><br>

        <button type="submit" class="btn">
            Analyze Resume
        </button>

    </form>

    </main>

</body>

</html>
